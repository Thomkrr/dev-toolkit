name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: Run lint
        run: dev-toolkit lint-fix
      - name: Run tests with coverage
        run: dev-toolkit test-cov
      - name: Check dependencies
        run: dev-toolkit deps-check

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: dev-toolkit dockerize && docker build -t dev-toolkit .
